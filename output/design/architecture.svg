<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950"><rect width="1500" height="950" fill="white"/><rect x="350" y="20" width="800" height="115" rx="14" fill="#f2f5f4" stroke="#294b41" stroke-width="3"/><text x="750.0" y="72" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="28" fill="#18342c">Surveyor and reviewer browsers</text><text x="750.0" y="109" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="28" fill="#18342c">Next.js interface and opaque session cookie</text><rect x="350" y="205" width="800" height="150" rx="14" fill="#f2f5f4" stroke="#294b41" stroke-width="3"/><text x="750.0" y="257" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="28" fill="#18342c">Next.js server route handlers</text><text x="750.0" y="294" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="28" fill="#18342c">Origin, body, session and role validation</text><text x="750.0" y="331" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="28" fill="#18342c">Intake, drafts, reports and safe error mapping</text><rect x="55" y="465" width="650" height="175" rx="14" fill="#f2f5f4" stroke="#294b41" stroke-width="3"/><text x="380.0" y="517" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="28" fill="#18342c">PostgreSQL guarded functions</text><text x="380.0" y="554" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="28" fill="#18342c">Accepted versions, field changes, decisions</text><text x="380.0" y="591" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="28" fill="#18342c">Sessions, batches, recovery jobs and safe events</text><text x="380.0" y="628" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="28" fill="#18342c">Record locks and commit-time integrity</text><rect x="795" y="465" width="650" height="175" rx="14" fill="#f2f5f4" stroke="#294b41" stroke-width="3"/><text x="1120.0" y="517" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="28" fill="#18342c">MongoDB restricted service access</text><text x="1120.0" y="554" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="28" fill="#18342c">Sealed source envelopes and form definitions</text><text x="1120.0" y="591" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="28" fill="#18342c">Owner-scoped editable or sealed drafts</text><text x="1120.0" y="628" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="28" fill="#18342c">Exact canonical source and evidence aggregates</text><rect x="350" y="745" width="800" height="150" rx="14" fill="#f2f5f4" stroke="#294b41" stroke-width="3"/><text x="750.0" y="797" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="28" fill="#18342c">Separate recovery worker process</text><text x="750.0" y="834" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="28" fill="#18342c">Bounded claims, fencing, retries and quarantine</text><text x="750.0" y="871" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="28" fill="#18342c">Resumes verified intake and sealed finalizing drafts</text><path d="M750 135 L750 205" stroke="#445650" stroke-width="3"/><polygon points="750,205 742,191 758,191" fill="#445650"/><text x="870.0" y="178.0" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="24">HTTP API</text><path d="M500 355 L500 465" stroke="#445650" stroke-width="3"/><polygon points="500,465 492,451 508,451" fill="#445650"/><text x="620.0" y="418.0" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="24">Session-aware SQL</text><path d="M1000 355 L1000 465" stroke="#445650" stroke-width="3"/><polygon points="1000,465 992,451 1008,451" fill="#445650"/><text x="1120.0" y="418.0" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="24">Verified document I/O</text><path d="M510 745 L510 640"